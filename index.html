<!DOCTYPE html>
<html>

<head>
    <title>WebXR Interaction</title>
    <!-- A-Frameの読み込み -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- 独自の動き（コンポーネント）をJavaScriptで定義 -->
    <script>
        AFRAME.registerComponent('change-color-on-click', {
            init: function () {
                // このスクリプトがくっついている図形を取得
                let el = this.el;
                // ランダムに選ぶ色のリスト
                let colors = ['#EF2D5E', '#4CC3D9', '#FFC65D', '#8A2BE2', '#32CD32'];

                // 「クリック（トリガー）」された時の処理
                el.addEventListener('click', function () {
                    let randomIndex = Math.floor(Math.random() * colors.length);
                    el.setAttribute('color', colors[randomIndex]);
                });
            }
        });
    </script>
</head>

<body>
    <!-- PC確認用にマウス操作(cursor)も有効化 -->
    <a-scene cursor="rayOrigin: mouse">

        <!-- ターゲットの箱（回転アニメーションと、クリック判定を追加） -->
        <a-box position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9" change-color-on-click
            animation="property: rotation; to: 0 405 0; loop: true; dur: 3000">
        </a-box>

        <!-- プレイヤーの視点とコントローラーの設定 -->
        <a-entity>
            <a-camera></a-camera>
            <!-- 右手・左手にレーザーポインターを持たせる -->
            <a-entity laser-controls="hand: right" raycaster="objects: a-box"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: a-box"></a-entity>
        </a-entity>

        <!-- 床と空 -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
        <a-sky color="#ECECEC"></a-sky>

    </a-scene>
</body>

</html>
