<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09150e" />
    <title>STADIUM SLUGGER — WebXR Baseball</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      :root {
        --cream: #fff4cf;
        --gold: #ffc83d;
        --red: #ff563f;
        --green: #123c27;
        --ink: #07120c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--ink);
        font-family: system-ui, "Yu Gothic", sans-serif;
        user-select: none;
      }

      .ui {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        color: #fff;
        text-shadow: 0 2px 5px #000;
      }

      .brand {
        position: absolute;
        top: 22px;
        left: 25px;
        font-weight: 1000;
        font-style: italic;
        font-size: 15px;
        letter-spacing: 0.2em;
        color: var(--gold);
      }

      .stats {
        position: absolute;
        top: 18px;
        right: 22px;
        display: flex;
        gap: 8px;
      }

      .stat {
        min-width: 82px;
        padding: 9px 12px;
        text-align: center;
        background: rgba(5, 18, 11, 0.78);
        border: 1px solid rgba(255, 244, 207, 0.35);
        border-radius: 7px;
      }

      .label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.16em;
        color: #b9caba;
      }

      .value {
        font-size: 20px;
        font-weight: 1000;
        color: var(--cream);
      }

      .count {
        position: absolute;
        left: 25px;
        bottom: 24px;
        padding: 11px 16px;
        border-radius: 8px;
        background: rgba(5, 18, 11, 0.78);
        font-weight: 900;
        letter-spacing: 0.13em;
      }

      .ball-count {
        color: #67df8b;
      }

      .strike-count {
        color: #ffd45c;
      }

      .out-count {
        color: #ff735f;
      }

      #message {
        position: absolute;
        left: 50%;
        top: 28%;
        transform: translate(-50%, -50%) scale(0.8);
        font-size: clamp(35px, 8vw, 76px);
        font-weight: 1000;
        font-style: italic;
        white-space: nowrap;
        color: var(--gold);
        opacity: 0;
        transition:
          opacity 0.15s,
          transform 0.15s;
        text-shadow:
          0 5px 0 #7b261c,
          0 8px 25px #000;
      }

      #message.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .tip {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.1em;
        color: #e8f0df;
        white-space: nowrap;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: auto;
        background: radial-gradient(
          circle at 50% 45%,
          rgba(44, 92, 54, 0.45),
          rgba(3, 10, 6, 0.93)
        );
        transition: 0.3s;
      }

      .overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .panel {
        width: min(590px, 91vw);
        padding: 42px 28px;
        text-align: center;
        border: 1px solid rgba(255, 200, 61, 0.55);
        border-radius: 15px;
        background: linear-gradient(
          150deg,
          rgba(14, 42, 25, 0.94),
          rgba(5, 17, 10, 0.94)
        );
        box-shadow:
          0 20px 80px #000,
          inset 0 0 40px rgba(255, 200, 61, 0.05);
      }

      .kicker {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.35em;
        color: #79e29c;
      }

      h1 {
        margin: 10px 0;
        font-size: clamp(42px, 10vw, 76px);
        line-height: 0.88;
        font-style: italic;
        letter-spacing: -0.05em;
        color: var(--cream);
        text-shadow: 4px 4px 0 #b22e23;
      }

      .subtitle {
        margin: 20px auto 25px;
        max-width: 450px;
        font-size: 13px;
        line-height: 1.8;
        color: #c7d8c7;
      }

      .rules {
        color: #ffe088;
        font-weight: 800;
      }

      .result {
        display: none;
        margin: 0 0 20px;
        color: var(--gold);
        font-weight: 900;
        line-height: 1.7;
      }

      button {
        border: 0;
        border-radius: 7px;
        padding: 14px 36px;
        background: linear-gradient(180deg, #ffe274, #ffb71b);
        color: #241604;
        font-weight: 1000;
        letter-spacing: 0.12em;
        cursor: pointer;
        box-shadow:
          0 5px 0 #9f5711,
          0 10px 28px #000;
        transition: 0.15s;
      }

      button:hover {
        transform: translateY(-2px);
      }

      @media (max-width: 600px) {
        .brand {
          top: 12px;
          left: 12px;
          font-size: 11px;
        }

        .stats {
          top: 10px;
          right: 10px;
        }

        .stat {
          min-width: 61px;
          padding: 6px;
        }

        .value {
          font-size: 16px;
        }

        .tip {
          bottom: 68px;
          font-size: 10px;
        }

        .count {
          left: 12px;
          bottom: 13px;
        }
      }
    </style>
    <script>
      AFRAME.registerComponent("baseball-game", {
        init() {
          this.active = false;
          this.score = 0;
          this.hits = 0;
          this.homeRuns = 0;
          this.strikes = 0;
          this.outs = 0;
          this.pitches = 0;
          this.nextPitch = 0;
          this.audio = null;
          this.ball = document.querySelector("#ball");
          this.bat = document.querySelector("#bat");
          this.pitcher = document.querySelector("#pitcher");
          this.message = document.querySelector("#message");
          this.overlay = document.querySelector("#overlay");
          this.button = document.querySelector("#startButton");
          this.button.addEventListener("click", (e) => {
            e.stopPropagation();
            this.start();
          });
          window.addEventListener("keydown", (e) => {
            if ((e.code === "Space" || e.code === "Enter") && !e.repeat) {
              e.preventDefault();
              this.swing();
            }
          });
          window.addEventListener("pointerdown", (e) => {
            if (this.active && !e.target.closest(".overlay")) this.swing();
          });
          document.querySelectorAll("[hand-controls]").forEach((c) => {
            c.addEventListener("triggerdown", () => this.swing());
            c.addEventListener("gripdown", () => this.swing());
          });
          this.xrMenu = document.querySelector("#xrMenu");
          this.el.addEventListener("enter-vr", () => {
            this.overlay.classList.add("hidden");
            const showMenu = !this.active;
            this.xrMenu.setAttribute("visible", showMenu);
            const xrBtn = this.xrMenu.querySelector("[xr-start]");
            if (xrBtn) {
              if (showMenu) xrBtn.classList.add("clickable");
              else xrBtn.classList.remove("clickable");
            }
          });
          this.el.addEventListener("exit-vr", () => {
            this.xrMenu.setAttribute("visible", false);
            const xrBtn = this.xrMenu.querySelector("[xr-start]");
            if (xrBtn) xrBtn.classList.remove("clickable");
            if (!this.active) this.overlay.classList.remove("hidden");
          });
          this.updateUI();
        },
        start() {
          this.active = true;
          this.score = 0;
          this.hits = 0;
          this.homeRuns = 0;
          this.strikes = 0;
          this.outs = 0;
          this.pitches = 0;
          this.nextPitch = 700;
          this.ball.components.pitch.reset();
          this.overlay.classList.add("hidden");
          this.xrMenu.setAttribute("visible", false);
          try {
            this.audio =
              this.audio ||
              new (window.AudioContext || window.webkitAudioContext)();
            this.audio.resume();
          } catch (e) {}
          this.updateUI();
          this.callout("PLAY BALL!", 900);
        },
        tick(t, dt) {
          if (!this.active) return;
          if (this.nextPitch > 0) {
            this.nextPitch -= dt;
            if (this.nextPitch <= 0) this.ball.components.pitch.throwBall();
          }
        },
        swing() {
          if (
            !this.active ||
            this.el.is("vr-mode") ||
            this.bat.components["bat-swing"].swinging
          )
            return;
          this.bat.components["bat-swing"].go();
          this.tone(115, 0.07, "triangle");
          const p = this.ball.components.pitch;
          if (!p.flying) return;
          const pos = this.ball.object3D.position;
          if (
            pos.z > -1.15 &&
            pos.z < 0.42 &&
            pos.y > 0.28 &&
            pos.y < 2.7 &&
            Math.abs(pos.x) < 1.28
          ) {
            const center =
              Math.abs(pos.z + 0.33) +
              Math.abs(pos.y - 1.16) * 0.35 +
              Math.abs(pos.x) * 0.3;
            this.contactHit(center);
          }
        },
        contactHit(quality) {
          const p = this.ball.components.pitch;
          if (!p.flying || p.batted) return;
          p.hit(quality);
          this.hits++;
          this.score += quality < 0.34 ? 1000 : quality < 0.7 ? 500 : 250;
          if (quality < 0.34) this.homeRuns++;
          this.callout(
            quality < 0.34 ? "HOME RUN!" : quality < 0.7 ? "NICE HIT!" : "HIT!",
            950,
          );
          this.tone(quality < 0.34 ? 520 : 360, 0.18, "square");
          this.updateUI();
        },
        pitchDone(result) {
          if (!this.active) return;
          this.pitches++;
          if (result === "strike") {
            this.strikes++;
            this.callout("STRIKE!", 650);
            this.tone(80, 0.14, "sawtooth");
            if (this.strikes >= 3) {
              this.outs++;
              this.strikes = 0;
              setTimeout(() => this.callout("OUT!", 700), 500);
            }
          } else if (result === "foul") {
            this.strikes = Math.min(2, this.strikes + 1);
            this.callout("FOUL", 650);
          }
          if (this.outs >= 3 || this.pitches >= 12) {
            setTimeout(() => this.end(), 900);
            return;
          }
          this.nextPitch = 1050 + Math.random() * 2100;
          this.updateUI();
        },
        end() {
          if (!this.active) return;
          this.active = false;
          this.ball.components.pitch.reset();
          document.querySelector("#result").style.display = "block";
          document.querySelector("#result").innerHTML =
            `試合終了！<br>SCORE ${this.score.toLocaleString()} ／ ${this.hits} HITS ／ ${this.homeRuns} HR`;
          this.button.textContent = "もう一度プレイ";
          if (this.el.is("vr-mode")) {
            this.xrMenu.setAttribute("visible", true);
            document
              .querySelector("#xrResult")
              .setAttribute(
                "value",
                `SCORE ${this.score}  HITS ${this.hits}  HR ${this.homeRuns}`,
              );
          } else this.overlay.classList.remove("hidden");
        },
        callout(s, ms) {
          this.message.textContent = s;
          this.message.classList.add("show");
          clearTimeout(this.msgTimer);
          this.msgTimer = setTimeout(
            () => this.message.classList.remove("show"),
            ms,
          );
        },
        tone(f, d, type) {
          if (!this.audio) return;
          const o = this.audio.createOscillator(),
            g = this.audio.createGain();
          o.type = type;
          o.frequency.setValueAtTime(f, this.audio.currentTime);
          g.gain.setValueAtTime(0.045, this.audio.currentTime);
          g.gain.exponentialRampToValueAtTime(
            0.001,
            this.audio.currentTime + d,
          );
          o.connect(g).connect(this.audio.destination);
          o.start();
          o.stop(this.audio.currentTime + d);
        },
        updateUI() {
          document.querySelector("#score").textContent = String(
            this.score,
          ).padStart(5, "0");
          document.querySelector("#hits").textContent = this.hits;
          document.querySelector("#hr").textContent = this.homeRuns;
          
          const strikeText = "●".repeat(this.strikes) + "○".repeat(Math.max(0, 2 - this.strikes));
          const outText = "●".repeat(this.outs) + "○".repeat(Math.max(0, 3 - this.outs));
          
          document.querySelector("#strikes").textContent = strikeText;
          document.querySelector("#outs").textContent = outText;

          const xrScoreEl = document.querySelector("#xrScore");
          if (xrScoreEl) xrScoreEl.setAttribute("value", "SCORE: " + this.score);
          
          const xrStrikesEl = document.querySelector("#xrStrikes");
          if (xrStrikesEl) xrStrikesEl.setAttribute("value", "S: " + strikeText);
          
          const xrOutsEl = document.querySelector("#xrOuts");
          if (xrOutsEl) xrOutsEl.setAttribute("value", "O: " + outText);
        },
      });

      AFRAME.registerComponent("pitch", {
        init() {
          this.flying = false;
          this.batted = false;
          this.winding = false;
          this.crossedPlate = false;
          this.v = new THREE.Vector3();
          this.startPos = new THREE.Vector3();
          this.flightTime = 0;
          this.reset();
        },
        reset() {
          this.flying = false;
          this.batted = false;
          this.winding = false;
          this.crossedPlate = false;
          clearTimeout(this.releaseTimer);
          this.el.setAttribute("visible", false);
        },
        throwBall() {
          const gm = this.el.sceneEl.components["baseball-game"];
          if (!gm.active) return;
          this.winding = true;
          gm.callout("GET READY", 430);
          gm.pitcher.removeAttribute("animation__throw");
          gm.pitcher.setAttribute(
            "animation__throw",
            "property:rotation;from:0 0 0;to:-24 0 10;dir:alternate;dur:330;loop:1;easing:easeInOutQuad",
          );
          this.releaseTimer = setTimeout(() => {
            // Uniform random target across the visible strike zone: inside/outside
            // and high/low pitches all have the same chance.
            if (!gm.active) return;
            const targetX = THREE.MathUtils.lerp(-0.4, 0.4, Math.random()),
              targetY = THREE.MathUtils.lerp(0.8, 1.48, Math.random()),
              speed = 22 + Math.random() * 4,
              distance = 15.9,
              time = distance / speed;
            this.startPos.set(-0.32, 2.02, -15.55);
            this.el.object3D.position.copy(this.startPos);
            this.v.set((targetX + 0.32) / time, (targetY - 2.02) / time, speed);
            this.flightTime = 0;
            this.flying = true;
            this.winding = false;
            this.batted = false;
            this.crossedPlate = false;
            this.el.setAttribute("visible", true);
            gm.tone(145, 0.045, "triangle");
          }, 560);
        },
        hit(quality) {
          this.batted = true;
          const p = this.el.object3D.position;
          this.v.set(
            -p.x * 1.8 + (Math.random() - 0.5) * 2.5,
            quality < 0.34 ? 10.5 : 7.5,
            quality < 0.34 ? -18 : -13 - Math.random() * 3,
          );
          this.spin = quality < 0.34 ? 0.025 : 0.04;
        },
        tick(t, dt) {
          if (!this.flying) return;
          const d = Math.min(dt / 1000, 0.035),
            p = this.el.object3D.position;
          if (this.batted) {
            p.addScaledVector(this.v, d);
            this.v.y -= 9.8 * d;
          } else {
            this.flightTime += d;
            p.copy(this.startPos).addScaledVector(this.v, this.flightTime);
          }
          this.el.object3D.rotation.x += d * 18;
          this.el.object3D.rotation.z += d * 11;
          const gm = this.el.sceneEl.components["baseball-game"];
          if (this.batted) {
            if (p.y < 0.08 || p.z < -55) {
              this.flying = false;
              this.el.setAttribute("visible", false);
              gm.pitchDone("hit");
            }
          } else {
            if (!this.crossedPlate && p.z >= 0.35) {
              this.crossedPlate = true;
            }
            if (this.crossedPlate && p.z > 2.8) {
              this.flying = false;
              this.el.setAttribute("visible", false);
              gm.tone(105, 0.05, "triangle");
              gm.pitchDone("strike");
            } else if (!this.crossedPlate && p.y < 0.05) {
              this.flying = false;
              this.el.setAttribute("visible", false);
              gm.nextPitch = 650;
            }
          }
        },
      });

      AFRAME.registerComponent("bat-swing", {
        init() {
          this.swinging = false;
          this.rest = new THREE.Euler(0, 0, THREE.MathUtils.degToRad(-28));
          this.hand = document.querySelector("#rightHand");
          this.lastTip = new THREE.Vector3();
          this.tip = new THREE.Vector3();
          this.base = new THREE.Vector3();
          this.handPos = new THREE.Vector3();
          this.handQuat = new THREE.Quaternion();
          this.offsetQuat = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(-Math.PI / 2, 0, 0),
          );
          this.ready = false;
        },
        go() {
          this.swinging = true;
          this.elapsed = 0;
        },
        tick(t, dt) {
          const gm = this.el.sceneEl.components["baseball-game"];
          if (this.el.sceneEl.is("vr-mode") && this.hand) {
            this.hand.object3D.getWorldPosition(this.handPos);
            this.hand.object3D.getWorldQuaternion(this.handQuat);
            this.el.object3D.position.copy(this.handPos);
            this.el.object3D.quaternion
              .copy(this.handQuat)
              .multiply(this.offsetQuat);
            this.el.object3D.updateMatrixWorld(true);
            // The controller pose sits at the middle of the taped grip.  Collision
            // follows the actual bat axis from the knob to the end of the barrel.
            this.base
              .set(0, -0.25, 0)
              .applyMatrix4(this.el.object3D.matrixWorld);
            this.tip.set(0, 1.48, 0).applyMatrix4(this.el.object3D.matrixWorld);
            const speed =
              this.ready && dt
                ? this.tip.distanceTo(this.lastTip) / (dt / 1000)
                : 0;
            const pitch = gm?.ball.components.pitch;
            if (gm?.active && pitch?.flying && !pitch.batted && speed > 1.25) {
              const bp = gm.ball.object3D.position,
                seg = new THREE.Vector3().subVectors(this.tip, this.base),
                toBall = new THREE.Vector3().subVectors(bp, this.base);
              const u = THREE.MathUtils.clamp(
                toBall.dot(seg) / seg.lengthSq(),
                0,
                1,
              );
              const near = this.base.clone().addScaledVector(seg, u);
              if (near.distanceTo(bp) < 0.24) {
                const quality = THREE.MathUtils.clamp(
                  0.22 + (4.5 - speed) * 0.09,
                  0.12,
                  0.8,
                );
                gm.contactHit(quality);
              }
            }
            this.lastTip.copy(this.tip);
            this.ready = true;
            return;
          }
          this.ready = false;
          if (!this.swinging) return;
          this.elapsed += dt;
          const u = Math.min(1, this.elapsed / 260),
            a = -28 + 205 * Math.sin(u * Math.PI * 0.86);
          this.el.object3D.rotation.set(
            0,
            THREE.MathUtils.degToRad(-18 + 45 * u),
            THREE.MathUtils.degToRad(a),
          );
          if (u >= 1) {
            this.swinging = false;
            this.el.object3D.rotation.set(0, 0, THREE.MathUtils.degToRad(-28));
          }
        },
      });

      AFRAME.registerComponent("xr-start", {
        init() {
          this.el.addEventListener("mouseenter", () => {
            if (this.el.sceneEl.is("vr-mode")) {
              this.el.setAttribute("material", "color", "#ffe477");
            }
          });
          this.el.addEventListener("mouseleave", () => {
            this.el.setAttribute("material", "color", "#ffc83d");
          });
          this.el.addEventListener("click", (e) => {
            e.stopPropagation();
            const game = this.el.sceneEl.components["baseball-game"];
            if (this.el.sceneEl.is("vr-mode") && !game.active) {
              game.start();
            }
          });
        },
      });
    </script>
  </head>

  <body>
    <div class="ui">
      <div class="brand">STADIUM SLUGGER</div>
      <div class="stats">
        <div class="stat">
          <span class="label">SCORE</span
          ><span id="score" class="value">00000</span>
        </div>
        <div class="stat">
          <span class="label">HITS</span><span id="hits" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">HOME RUN</span
          ><span id="hr" class="value">0</span>
        </div>
      </div>
      <div class="count">
        <span class="strike-count">S <b id="strikes">○○</b></span
        >　<span class="out-count">O <b id="outs">○○○</b></span>
      </div>
      <div id="message"></div>
      <div class="tip">クリック / スペース / VRトリガーでスイング</div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <div class="kicker">WEBXR BATTING CHALLENGE</div>
          <h1>STADIUM<br />SLUGGER</h1>
          <p class="subtitle">
            投手がランダムなタイミングと球速で投げてきます。<br />ボールをよく見て、ホームベースの上でスイング！<br /><span
              class="rules"
              >全12球、または3アウトで試合終了</span
            >
          </p>
          <p id="result" class="result"></p>
          <button id="startButton">プレイボール！</button>
        </div>
      </div>
    </div>
    <a-scene
      baseball-game
      cursor="rayOrigin:mouse"
      raycaster="objects:.clickable"
      vr-mode-ui="enabled:true"
      renderer="colorManagement:true;antialias:true;physicallyCorrectLights:true"
      background="color:#8cc8e8"
    >
      <a-assets
        ><a-mixin id="white" material="color:#eee;roughness:.85"></a-mixin
      ></a-assets>
      <!-- Right-handed view: a small parallel offset, still looking straight downfield. -->
      <a-entity id="rig" position="-.55 0 2.1" rotation="0 0 0">
        <a-camera
          position="0 1.65 0"
          look-controls
          wasd-controls="enabled:false"
          ><a-entity
            cursor="fuse:false"
            raycaster="objects:.clickable;far:12"
            position="0 0 -1"
            ><a-ring
              radius-inner=".012"
              radius-outer=".018"
              color="#fff"
              material="shader:flat"
            ></a-ring></a-entity
        ></a-camera>
        <a-entity
          id="rightHand"
          hand-controls="hand:right;handModelStyle:lowPoly;color:#c48b62"
          laser-controls="hand:right"
          raycaster="objects:.clickable;far:12"
          line="color:#ffc83d"
        ></a-entity
        ><a-entity
          id="leftHand"
          hand-controls="hand:left;handModelStyle:lowPoly;color:#c48b62"
          laser-controls="hand:left"
          raycaster="objects:.clickable;far:12"
          line="color:#ffc83d"
        ></a-entity>
